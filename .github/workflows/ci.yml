name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR supersedes the in-flight run; main pushes stay
# uninterrupted so the branch protection signal is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which areas a PR touches; downstream jobs skip the checks that cannot
  # be affected. Shared files (Makefile, schema, generated code) count as
  # both Go and web because the drift gates span them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'api/openapi/**'
              - 'queries/**'
              - 'migrations/**'
              - 'Makefile'
              - '.golangci.yml'
            web:
              - 'web/**'
              - 'api/openapi/**'
              - 'Makefile'

  web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a9
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Lint (oxlint) and format check (oxfmt)
        run: cd web && npm run lint && npm run format:check
      - name: Type-check and build
        run: cd web && npm run build
      - name: Architecture boundaries (dependency-cruiser)
        run: make web-check-boundaries
      - name: Size budget (<=400 per file, <=80 per route)
        run: make check-size-web
      - name: Test (vitest with coverage floor)
        run: cd web && npm run test:coverage

  build-test:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Size budget (max 400 lines per hand-written production file)
        run: make check-size
      - name: Test (coverage floor)
        run: make coverage-check

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08edb04283 # v6.1.0
        with:
          # Must be built with a Go ≥ the module's toolchain directive
          # (go1.26.6); older analyzers refuse the module or hide findings.
          version: v2.14.0

  # Known-vulnerability scan of the Go module graph against the vuln DB,
  # failing on call paths into vulnerable stdlib/module symbols.
  vulncheck:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a
        with:
          go-version-file: go.mod
      - name: Govulncheck
        run: make vulncheck

  integration:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a
        with:
          go-version-file: go.mod
      - name: Store contract tests
        run: go test -tags=integration ./test/integration/ -count=1 -timeout 10m

  # Browser E2E over the real thing: builds the SPA, embeds it into the Go
  # binary, boots it on the in-memory store with the demo seed, and walks the
  # critical journeys (register/login/logout, tickets, landing) in Chromium.
  web-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a9
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a
        with:
          go-version-file: go.mod
      - name: Install web deps
        run: cd web && npm ci
      - name: Install Playwright browser
        run: cd web && npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: cd web && npm run test:e2e
      - name: Upload traces and report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # The generated code (sqlc queries, oapi-codegen types, frontend
  # schema.gen.ts) must match its sources, and the contract itself must
  # lint clean. A PR that edits queries/ or openapi.yaml without
  # regenerating fails here instead of surprising whoever runs
  # `make generate` next.
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a9
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps (the TS schema generation runs inside make generate)
        run: cd web && npm ci
      - name: Regenerate, lint the contract, and reject drift
        run: |
          make generate
          make lint-spec
          git diff --exit-code

  docker:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
            COMMIT=${{ github.sha }}
