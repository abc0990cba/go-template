# Release notes that write themselves: on every tagged release this workflow
# opens/updates a GitHub Release draft grouping the PRs since the last tag.
# Categories are plain prefixes on PR titles — no conventional-commit
# discipline required, just keep titles one-line and human.
name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@3f0f8700bd06420c95e8d25e1f4d3463e8b2e2d9 # v6.0.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
