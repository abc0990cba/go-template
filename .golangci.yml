version: "2"

run:
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - copyloopvar
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Jitter uses a fast non-crypto generator on purpose; it is not a secret.
      - path: internal/reliability/retry\.go
        linters: [gosec]
        text: "G404"
      # MemoryStore methods keep ctx so the future PostgreSQL adapter can
      # implement the same surface; the fake itself has no use for it yet.
      - path: internal/repository/memory\.go
        linters: [revive]
        text: "unused-parameter"

formatters:
  enable:
    - gofmt
