openapi: 3.1.0
info:
  title: Go Template Playground API
  version: 1.0.0
  description: |
    The JSON API of the template service. The contract is the source of truth
    for HTTP behavior; `oapi-codegen` generates the Go types from this file
    (`make generate`), and CI rejects any drift between the two.

    Errors use RFC 9457 problem+json bodies. Authentication uses the opaque
    session token either as `Authorization: Bearer <token>` (API) or as the
    `app_session` cookie (browser).
servers:
  - url: http://localhost:8080
tags:
  - name: health
  - name: auth
  - name: users
  - name: jobs
  - name: reports
  - name: analytics
  - name: rbac
  - name: audit
  - name: settings
  - name: notifications
  - name: apikeys
  - name: impersonation
  - name: webhooks
  - name: tickets
  - name: emails
paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getLiveHealth
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe (checks PostgreSQL and Redis)
      operationId: getReadyHealth
      responses:
        "200": { $ref: "#/components/responses/Status" }
        "503": { $ref: "#/components/responses/Status" }
  /health/startup:
    get:
      tags: [health]
      summary: Startup probe
      operationId: getStartupHealth
      responses:
        "200": { $ref: "#/components/responses/Status" }
  /version:
    get:
      tags: [health]
      summary: Build metadata (version/commit/date, stamped via ldflags)
      operationId: getVersion
      responses:
        "200":
          description: Build metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  commit: { type: string }
                  date: { type: string }
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Created user with session token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithToken" }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: User with session token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithToken" }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the presented session
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked }
  /api/auth/mfa/challenge:
    post:
      tags: [auth]
      summary: Complete an MFA login with a TOTP or recovery code
      operationId: mfaChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFAChallengeRequest" }
      responses:
        "200":
          description: User with session token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithToken" }
        default: { $ref: "#/components/responses/Problem" }
  /api/users/me/export:
    post:
      tags: [users]
      summary: Request a GDPR data export (async job)
      description: One live export per user; a queued or running request answers 409.
      operationId: requestExport
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status]
                properties:
                  job_id: { type: string }
                  status: { type: string }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [users]
      summary: The caller's latest export job status
      operationId: exportStatus
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string }
                  error: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /api/users/me/export/download:
    get:
      tags: [users]
      summary: Download the latest finished export bundle (ZIP of JSON)
      description: 202 with Retry-While while the export runs; bundles expire after 7 days (worker pruned).
      operationId: downloadExport
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The ZIP bundle
        "202": { description: Export still running }
        default: { $ref: "#/components/responses/Problem" }
  /api/files:
    post:
      tags: [files]
      summary: Upload a file (multipart/form-data)
      description: >-
        Fields: `file` (required), `ref_type` + `ref_id` (optional attachment
        target — `ticket` validates visibility against the ticket). The
        route's body cap is the configured upload limit instead of the
        default 1 MiB.
      operationId: uploadFile
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                ref_type: { type: string, enum: [ticket] }
                ref_id: { type: string }
      responses:
        "201":
          description: Stored metadata (checksum included)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        default: { $ref: "#/components/responses/Problem" }
  /api/files/{id}:
    get:
      tags: [files]
      summary: File metadata
      operationId: getFile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/fileId" }]
      responses:
        "200":
          description: Metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [files]
      summary: Soft-delete metadata and remove the blob (owner only)
      operationId: deleteFile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/fileId" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/files/{id}/content:
    get:
      tags: [files]
      summary: Stream the blob through the API (works in every storage mode)
      operationId: downloadFile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/fileId" }]
      responses:
        "200":
          description: The raw bytes (attachment disposition)
        default: { $ref: "#/components/responses/Problem" }
  /api/files/{id}/url:
    get:
      tags: [files]
      summary: Presigned direct-download URL (S3 mode only)
      operationId: presignFile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/fileId" }]
      responses:
        "200":
          description: URL + TTL
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_in]
                properties:
                  url: { type: string }
                  expires_in: { type: integer }
        "501": { description: The active store cannot presign (in-memory mode) }
        default: { $ref: "#/components/responses/Problem" }
  /api/tickets/{id}/attachments:
    get:
      tags: [files]
      summary: A ticket's attachments (ticket visibility applies)
      operationId: ticketAttachments
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ticketId" }]
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/File" }
        default: { $ref: "#/components/responses/Problem" }
  /api/search:
    get:
      tags: [search]
      summary: Combined full-text search over users and tickets
      description: >-
        Permission-scoped: the users section requires users:read, the tickets
        section tickets:read — and without tickets:read_all only the caller's
        own tickets come back. Postgres ranks by tsvector relevance; the
        in-memory store substring-matches.
      operationId: search
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          description: Websearch-style query ("invoices approved")
          schema: { type: string }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Matching entities the caller may see
          content:
            application/json:
              schema:
                type: object
                required: [users, tickets]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/token:
    post:
      tags: [auth]
      summary: OAuth-style token grant (password | mfa_challenge | refresh_token)
      description: >-
        Issues a short-lived HS256 access JWT plus a rotating refresh token
        for non-browser clients. Requires APP_JWT_SECRET; otherwise 501.
        Enrolled accounts answer 401 mfa_required with a challenge to finish
        via grant_type mfa_challenge. Presenting a rotated refresh token
        revokes its whole family (reuse detection).
      operationId: token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenGrantRequest" }
      responses:
        "200":
          description: Access + refresh tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenGrant" }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/token/revoke:
    post:
      tags: [auth]
      summary: Revoke tokens (idempotent)
      description: >-
        Carrying refresh_token revokes it (reuse of a revoked refresh token
        revokes its whole family). Carrying access_token denylists that
        access token's jti until it expires, so logout is immediate for
        Bearer clients. At least one field is required.
      operationId: revokeToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                refresh_token: { type: string }
                access_token: { type: string }
      responses:
        "204": { description: Token revoked or unknown }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/mfa/status:
    get:
      tags: [auth]
      summary: Two-factor enrollment status for the current user
      operationId: mfaStatus
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Enrollment state and the mfa.required policy flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/mfa/enroll:
    post:
      tags: [auth]
      summary: Start TOTP enrollment (secret + otpauth URI for the QR code)
      operationId: mfaEnroll
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Base32 secret and provisioning URI
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollment" }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/mfa/verify:
    post:
      tags: [auth]
      summary: Confirm enrollment with a code; returns recovery codes once
      operationId: mfaVerify
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFACodeRequest" }
      responses:
        "200":
          description: Single-use recovery codes (shown only now)
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/mfa/disable:
    post:
      tags: [auth]
      summary: Disable two-factor authentication (password + current code)
      operationId: mfaDisable
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFADisableRequest" }
      responses:
        "204": { description: Two-factor disabled }
        default: { $ref: "#/components/responses/Problem" }
  /api/me:
    get:
      tags: [auth]
      summary: Current user
      description: >-
        The SPA's session probe: the account plus the RBAC context (active
        organization, roles, expanded catalog permissions) the UI gates
        navigation and actions on, plus the impersonation state.
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The session context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }
  /api/users:
    get:
      tags: [users]
      summary: List users with offset, cursor, or keyset pagination
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/mode"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: after
          in: query
          description: Last user id of the previous page (cursor and keyset modes)
          schema: { type: string }
        - name: q
          in: query
          description: Substring filter over email and name
          schema: { type: string }
      responses:
        "200":
          description: One page of users plus the next-page cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [users]
      summary: Create a user without a password credential
      operationId: createUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      tags: [users]
      summary: Get a user by id
      operationId: getUser
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [users]
      summary: Replace a user's email and name
      operationId: updateUser
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            Optimistic locking: the ETag returned by a prior GET of this
            user. A stale tag answers 412 without applying the change; an
            absent header keeps last-write-wins.
          schema: { type: string }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [users]
      summary: Delete a user
      operationId: deleteUser
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/users/{id}/unlock:
    parameters:
      - $ref: "#/components/parameters/userId"
    post:
      tags: [auth]
      summary: Clear a locked account's login-failure counter
      description: >-
        Admin action for progressive lockout: the account can log in again
        immediately. Idempotent — unlocking an unlocked account succeeds —
        and the answer never reveals which accounts were locked.
      operationId: unlockUser
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The account is usable again
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /api/users/{id}/enrich-demo:
    parameters:
      - $ref: "#/components/parameters/userId"
    post:
      tags: [users]
      summary: Publish a test enrichment event for this user
      description: >-
        Manual-testing hook: publishes one real profile (Kafka) or contact
        (NATS) event carrying the user's external_ref and the next sequence
        number. The stream consumers apply it exactly like production traffic;
        the user's enrichment fields update within moments.
      operationId: triggerEnrichDemo
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrichDemoRequest" }
      responses:
        "200":
          description: Event published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrichDemoResult" }
        default: { $ref: "#/components/responses/Problem" }
  /api/jobs:
    get:
      tags: [jobs]
      summary: List background jobs with offset, cursor, or keyset pagination
      operationId: listJobs
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/mode"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: after
          in: query
          description: Last job id of the previous page (cursor and keyset modes)
          schema: { type: string }
        - name: q
          in: query
          description: Substring filter over type and error
          schema: { type: string }
        - name: status
          in: query
          description: Filter by lifecycle status
          schema: { type: string, enum: [queued, running, done, failed] }
        - name: type
          in: query
          description: Filter by job type
          schema: { type: string }
      responses:
        "200":
          description: One page of jobs plus the next-page cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        default: { $ref: "#/components/responses/Problem" }
  /api/jobs/enrichment:
    post:
      tags: [jobs]
      summary: Enqueue an enrichment batch
      operationId: enqueueEnrichment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
  /api/streams/outbox:
    get:
      tags: [jobs]
      summary: Page the transactional outbox awaiting relay publication
      description: >-
        Streams admin console feed: every domain event written in the same
        transaction as the change it describes, newest first, with the count
        of not-yet-published events for the page chip. status=pending filters
        to unpublished events.
      operationId: listOutbox
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/mode"
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
        - name: after
          in: query
          description: Last event id of the previous page (cursor and keyset modes)
          schema: { type: string }
        - name: status
          in: query
          description: pending limits the page to events the relay has not published yet
          schema: { type: string, enum: [pending] }
      responses:
        "200":
          description: One page of outbox events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OutboxList"
                  - type: object
                    required: [pending]
                    properties:
                      pending: { type: integer, description: Events not yet published }
        default: { $ref: "#/components/responses/Problem" }
  /api/streams/dead-letters:
    get:
      tags: [jobs]
      summary: Page parked poison messages for inspection and replay
      description: >-
        Streams admin console feed of messages the pipeline could not apply,
        newest first, with the count of not-yet-replayed letters for the page
        chip. pending=true filters to unreplayed letters.
      operationId: listDeadLetters
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/mode"
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/offset" }
        - name: after
          in: query
          description: Last letter id of the previous page (cursor and keyset modes)
          schema: { type: string }
        - name: pending
          in: query
          description: "true limits the page to letters not replayed yet"
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: One page of dead letters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DeadLetterList"
                  - type: object
                    required: [pending]
                    properties:
                      pending: { type: integer, description: Letters not yet replayed }
        default: { $ref: "#/components/responses/Problem" }
  /api/streams/dead-letters/{id}/replay:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [jobs]
      summary: Re-run a parked message through its live handler
      description: >-
        Every attempt — successful or not — is audit-logged with the outcome,
        so the console can show who replayed what and when.
      operationId: replayDeadLetter
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The letter after the replay attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadLetter" }
        default: { $ref: "#/components/responses/Problem" }
  /api/reports:
    get:
      tags: [reports]
      summary: List snapshot reports with offset, cursor, or keyset pagination
      operationId: listReports
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/mode"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: after
          in: query
          description: Last report id of the previous page (cursor and keyset modes)
          schema: { type: string }
        - name: q
          in: query
          description: Substring filter over status and result
          schema: { type: string }
      responses:
        "200":
          description: One page of reports plus the next-page cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [reports]
      summary: Enqueue a report generation job
      operationId: generateReport
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
  /api/analytics/summary:
    get:
      tags: [analytics]
      summary: Dashboard counters
      operationId: getAnalyticsSummary
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Aggregated counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
        default: { $ref: "#/components/responses/Problem" }
  /api/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [jobs]
      summary: Get a job by id
      operationId: getJob
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Problem" }
  /api/jobs/process:
    post:
      tags: [jobs]
      summary: Claim and run the oldest queued job in-process (no-op with a distributed queue)
      operationId: processJob
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Whether a job was processed
          content:
            application/json:
              schema:
                type: object
                required: [processed]
                properties:
                  processed: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /api/enrichment-profiles:
    get:
      tags: [jobs]
      summary: List fetched enrichment profiles with offset, cursor, or keyset pagination
      operationId: listEnrichmentProfiles
      security: [{ bearerAuth: [] }]
