    post:
      tags: [auth]
      summary: Consume a reset token and set a new password
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "204": { description: Updated }
        default: { $ref: "#/components/responses/Problem" }
  /api/auth/verify-email:
    post:
      tags: [auth]
      summary: Consume an email verification token
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Verified }
        default: { $ref: "#/components/responses/Problem" }
  /api/api-keys:
    get:
      tags: [apikeys]
      summary: List the caller's API keys
      operationId: listApiKeys
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/APIKeyList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [apikeys]
      summary: Issue a key (secret shown once)
      operationId: createApiKey
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes: { type: array, items: { type: string } }
                ttl: { type: string, description: "Optional duration, e.g. 720h" }
      responses:
        "201":
          description: The key with its one-time secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: "#/components/schemas/APIKey" }
                  secret: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /api/api-keys/{id}:
    delete:
      tags: [apikeys]
      summary: Revoke a key
      operationId: revokeApiKey
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/apiKeyId" }]
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Problem" }
  /api/impersonation:
    post:
      tags: [impersonation]
      summary: Start an impersonation session
      operationId: startImpersonation
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
      responses:
        "200":
          description: Impersonating
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  user_id: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /api/impersonation/stop:
    post:
      tags: [impersonation]
      summary: End impersonation and restore the admin session
      operationId: stopImpersonation
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Stopped }
        default: { $ref: "#/components/responses/Problem" }
  /api/emails:
    get:
      tags: [emails]
      summary: List the outbound email delivery log
      operationId: listEmailMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, sent, failed, dead] }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: The delivery log, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EmailMessage" }
        default: { $ref: "#/components/responses/Problem" }
  /api/emails/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [emails]
      summary: Get one delivery-log entry
      operationId: getEmailMessage
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The recorded message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailMessage" }
        default: { $ref: "#/components/responses/Problem" }
  /api/emails/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [emails]
      summary: Re-queue a failed or dead message for delivery
      description: >-
        Resets the message to queued and hands it back to the configured
        transport (the queue worker, or an inline send in sync mode).
        Re-delivering a sent message answers 409.
      operationId: retryEmailMessage
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The message, re-queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailMessage" }
        "409": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
  /api/webhooks:
    get:
      tags: [webhooks]
      summary: List webhook endpoints
      operationId: listWebhooks
      security: [{ bearerAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/WebhookEndpointList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [webhooks]
      summary: Create an endpoint (secret shown once)
      operationId: createWebhook
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                events: { type: array, items: { type: string } }
                secret: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created endpoint with one-time secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string }
                  secret: { type: string }
                  events: { type: array, items: { type: string } }
                  active: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /api/webhooks/{id}:
    put:
      tags: [webhooks]
      summary: Update an endpoint
      operationId: updateWebhook
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/webhookId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                events: { type: array, items: { type: string } }
                description: { type: string }
                active: { type: boolean }
      responses:
        "204": { description: Updated }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [webhooks]
      summary: Delete an endpoint (deliveries cascade)
      operationId: deleteWebhook
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/webhookId" }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/webhooks/{id}/deliveries:
    get:
      tags: [webhooks]
      summary: Page the delivery log
      operationId: listWebhookDeliveries
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/webhookId" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200": { $ref: "#/components/responses/WebhookDeliveryList" }
        default: { $ref: "#/components/responses/Problem" }
  /api/webhooks/{id}/test:
    post:
      tags: [webhooks]
      summary: Fire one synthetic test event
      operationId: testWebhook
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/webhookId" }]
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /api/analytics/breakdown:
    get:
      tags: [analytics]
      summary: Group events by one JSON property dimension
      operationId: getAnalyticsBreakdown
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: by, in: query, schema: { type: string, enum: [feature, source, country], default: feature } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200":
          description: Top values with counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/NameCount" }
        default: { $ref: "#/components/responses/Problem" }
  /api/analytics/dau:
    get:
      tags: [analytics]
      summary: Distinct active users per day
      operationId: getAnalyticsDAU
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200":
          description: One point per day
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DayCount" }
        default: { $ref: "#/components/responses/Problem" }
  /api/files/multipart:
    get:
      tags: [files]
      summary: Resumable-upload capability and its dev-mode shape
      operationId: multipartCapability
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Whether sessions are available and how parts are uploaded
          content:
            application/json:
              schema:
                type: object
                required: [enabled, streaming, max_size]
                properties:
                  enabled: { type: boolean }
                  streaming: { type: boolean }
                  max_size: { type: integer }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [files]
      summary: Open a resumable upload session
      description: >-
        Large attachments go to the file store in parts. Ticket attachments
        are visibility-checked like single-shot uploads. The response names
        the session, the destination key, and one presigned PUT URL per part
        (S3 mode); dev mode returns streaming=true and parts are PUT to
        /api/files/multipart/parts instead.
      operationId: initiateMultipart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, parts]
              properties:
                filename: { type: string }
                content_type: { type: string }
                parts: { type: integer, minimum: 2, maximum: 10000 }
                ref_type: { type: string, enum: [ticket] }
                ref_id: { type: string }
      responses:
        "201":
          description: Session opened
          content:
            application/json:
              schema:
                type: object
                required: [key, upload_id, streaming]
                properties:
                  key: { type: string }
                  upload_id: { type: string }
                  part_urls: { type: array, items: { type: string } }
                  streaming: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /api/files/multipart/parts:
    post:
      tags: [files]
      summary: Stream one part through the API (dev mode)
      description: >-
        Query parameters upload_id and part_number (1-based); the body is
        the raw part bytes. Only available when the capability reports
        streaming=true (the in-process file store).
      operationId: putMultipartPart
      security: [{ bearerAuth: [] }]
      parameters:
        - name: upload_id
          in: query
          required: true
          schema: { type: string }
        - name: part_number
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        # Part bytes arrive with whatever content type the uploader used.
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "204": { description: Part stored }
        default: { $ref: "#/components/responses/Problem" }
  /api/files/multipart/complete:
    post:
      tags: [files]
      summary: Assemble the parts and create the file record
      description: >-
        The listed parts (1-based numbers + the ETags the part uploads
        returned) are assembled into the object; the metadata row appears
        here, and the authoritative size comes from storage, not the client.
      operationId: completeMultipart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, key, upload_id, parts]
              properties:
                filename: { type: string }
                content_type: { type: string }
                key: { type: string }
                upload_id: { type: string }
                ref_type: { type: string, enum: [ticket] }
                ref_id: { type: string }
                parts:
                  type: array
                  items:
                    type: object
                    required: [part_number, etag]
                    properties:
                      part_number: { type: integer, minimum: 1 }
                      etag: { type: string }
      responses:
        "201":
          description: File created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/File" }
        default: { $ref: "#/components/responses/Problem" }
  /api/files/multipart/abort:
    post:
      tags: [files]
      summary: Discard an upload session
      description: >-
        The upload id is the capability — anyone holding it may abort.
        Abandoned sessions are also aborted by the worker after 24h.
      operationId: abortMultipart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, upload_id]
              properties:
                key: { type: string }
                upload_id: { type: string }
      responses:
        "204": { description: Session discarded }
        default: { $ref: "#/components/responses/Problem" }
  /api/tickets:
    get:
      tags: [tickets]
      summary: List tickets — own by default, org-wide with tickets:read_all
      operationId: listTickets
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/mode"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: after
          in: query
          description: Last ticket id of the previous page (cursor and keyset modes)
          schema: { type: string }
        - name: q
          in: query
          description: Substring filter over title and description
          schema: { type: string }
        - name: scope
          in: query
          description: my = tickets created by the caller; all requires tickets:read_all
          schema: { type: string, enum: [my, all], default: my }
        - name: status
          in: query
          description: Filter by lifecycle status
          schema: { type: string, enum: [draft, in_review, approved, completed, rejected, withdrawn] }
        - name: type
          in: query
          description: Filter by ticket type key
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high, urgent] }
      responses:
        "200":
          description: One page of tickets plus the next-page cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [tickets]
      summary: File a new draft ticket
      operationId: createTicket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type_id, title]
              properties:
                type_id: { type: string }
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high, urgent], default: medium }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
  /api/tickets/counts:
    get:
      tags: [tickets]
      summary: Ticket counts per status for the page chips
      description: Scoped like the list — own tickets by default, org-wide with scope=all and tickets:read_all.
      operationId: ticketCounts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [my, all], default: my }
      responses:
        "200":
          description: Count per status
          content:
            application/json:
              schema:
                type: object
                description: Status name to ticket count
                additionalProperties: { type: integer }
        default: { $ref: "#/components/responses/Problem" }
  /api/tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [tickets]
      summary: Get one ticket with its approval steps
      operationId: getTicket
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The ticket and its approval chain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [tickets]
      summary: Edit the draft (author only, drafts only)
      operationId: updateTicket
      security: [{ bearerAuth: [] }]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            Optimistic locking: the ETag returned by a prior GET of this
            ticket. A stale tag answers 412 without applying the edit; an
            absent header keeps last-write-wins.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high, urgent] }
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "412": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tickets]
      summary: Delete the draft (author only, drafts only)
      operationId: deleteTicket
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /api/tickets/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [tickets]
      summary: Apply a state-machine transition
      description: |
        submit/withdraw/complete/reopen are requester actions and require
        authorship; approve/reject are approver actions and require the
        current step's approver role plus tickets:approve. Rejections carry
        a mandatory comment. Illegal transitions answer 409.
      operationId: ticketAction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [submit, approve, reject, withdraw, complete, reopen] }
                comment: { type: string, description: Optional decision comment; mandatory for reject }
      responses:
        "200":
          description: The ticket after the transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        default: { $ref: "#/components/responses/Problem" }
  /api/tickets/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [tickets]
      summary: List the ticket's comments
      operationId: listTicketComments
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Comments newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketCommentList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [tickets]
      summary: Comment on the ticket
      operationId: addTicketComment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketComment" }
        default: { $ref: "#/components/responses/Problem" }
  /api/tickets/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [tickets]
      summary: List the ticket's timeline events
      operationId: listTicketEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Events newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketEventList" }
        default: { $ref: "#/components/responses/Problem" }
  /api/approvals:
    get:
      tags: [tickets]
      summary: The approver's queue and decision history
      description: |
        state=pending returns tickets waiting on one of the caller's roles at
        their current step (the inbox); state=decided returns the caller's
        past decisions with the ticket snapshots.
      operationId: listApprovals
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/mode"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: after
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [pending, decided], default: pending }
      responses:
        "200":
          description: The inbox page or the decision history
          content:
            application/json:
              schema:
                # anyOf, not oneOf: an empty page satisfies both branches, and
                # strict validators (JSON Schema 2020-12) reject oneOf when
                # more than one branch matches.
                anyOf:
                  - $ref: "#/components/schemas/TicketList"
                  - $ref: "#/components/schemas/TicketDecisionList"
        default: { $ref: "#/components/responses/Problem" }
  /api/ticket-types:
    get:
      tags: [tickets]
      summary: List the ticket types available in the domain
      operationId: listTicketTypes
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Platform-wide plus organization types
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketTypeList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [tickets]
      summary: Create a ticket type with its approval chain
      operationId: createTicketType
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name, steps]
              properties:
                key: { type: string }
                name: { type: string }
                description: { type: string }
                steps:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/TicketStep" }
                active: { type: boolean, default: true }
      responses:
        "201":
          description: Type created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketType" }
        default: { $ref: "#/components/responses/Problem" }
  /api/ticket-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [tickets]
      summary: Update the type (retire with active=false)
      operationId: updateTicketType
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                steps:
                  type: array
                  items: { $ref: "#/components/schemas/TicketStep" }
                active: { type: boolean }
      responses:
        "200":
          description: Updated type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketType" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tickets]
      summary: Delete the type
      operationId: deleteTicketType
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Opaque session token from register/login, a `gtpl_` API key, or a JWT
        access token from the token grant (when APP_JWT_SECRET is configured).
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token from POST /api/auth/token (identity claims only).
  parameters:
    fileId:
      name: id
      in: path
      required: true
      schema: { type: string }
    userId:
      name: id
      in: path
      required: true
      schema: { type: string }
    roleKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    orgId:
      name: orgId
      in: path
      required: true
      schema: { type: string }
    ticketId:
      name: id
      in: path
      required: true
      schema: { type: string }
    notificationId:
      name: id
      in: path
      required: true
      schema: { type: string }
    apiKeyId:
      name: id
      in: path
      required: true
      schema: { type: string }
    webhookId:
      name: id
      in: path
      required: true
      schema: { type: string }
    mode:
      name: mode
      in: query
      schema:
        type: string
        enum: [offset, cursor, keyset]
        default: offset
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
  responses:
    Status:
      description: Simple status object
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, example: ok }
    RoleList:
      description: Role metadata
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/Role" }
    PolicyRuleList:
      description: Policy or grouping rules
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/PolicyRule" }
    OrgMemberList:
      description: Organization members
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/OrgMember" }
    SettingList:
      description: Settings catalog
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/Setting" }
    NotificationList:
      description: Notifications newest first
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
    APIKeyList:
      description: API keys newest first
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/APIKey" }
    WebhookEndpointList:
      description: Webhook endpoints
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/WebhookEndpoint" }
    WebhookDeliveryList:
      description: Delivery log newest first
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: array
                items: { $ref: "#/components/schemas/WebhookDelivery" }
    RoleRef:
      description: A created role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Role" }
    OrganizationRef:
      description: A created organization
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Organization" }
    Problem:
      description: RFC 9457 problem document
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    File:
      type: object
      required: [id, owner_id, filename, content_type, size_bytes, created_at]
      properties:
        id: { type: string }
        owner_id: { type: string }
        org_id: { type: string }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        checksum_sha256: { type: string }
        ref_type: { type: string }
        ref_id: { type: string }
        created_at: { type: string, format: date-time }
    OrgInvitation:
      type: object
      required: [id, org_id, email, role, status, expires_at]
      properties:
        id: { type: string }
        org_id: { type: string }
        email: { type: string }
        role: { type: string }
        invited_by: { type: string }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
        accepted_by: { type: string }
        created_at: { type: string, format: date-time }
    TokenGrantRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [password, mfa_challenge, refresh_token]
        email: { type: string }
        password: { type: string }
        refresh_token: { type: string }
        challenge: { type: string }
        code: { type: string }
    TokenGrant:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Access token TTL in seconds }
        refresh_token: { type: string }
    MFAChallengeRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string, description: Token from the 401 mfa_required login response }
        code: { type: string, description: TOTP or recovery code }
    MFACodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    MFADisableRequest:
      type: object
      required: [password, code]
      properties:
        password: { type: string }
        code: { type: string }
    MFAEnrollment:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: { type: string, description: Base32 secret to enter manually }
        otpauth_url: { type: string, description: Provisioning URI to render as a QR code }
    MFAStatus:
      type: object
      required: [enabled, pending, required]
      properties:
        enabled: { type: boolean }
        pending: { type: boolean, description: Enrollment started but not confirmed }
        required: { type: boolean, description: The mfa.required policy flag }
    RbacResource:
      type: object
      required: [key, description, actions]
      properties:
        key: { type: string }
        description: { type: string }
        actions: { type: array, items: { type: string } }
    Permission:
      type: object
      required: [object, action]
      properties:
        object: { type: string }
        action: { type: string }
    Role:
      type: object
      required: [key, name, description, is_system, created_at]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
    PolicyRule:
      type: object
      required: [ptype, subject, domain]
      properties:
        ptype: { type: string, enum: [p, g] }
        subject: { type: string }
        domain: { type: string }
        object: { type: string }
        action: { type: string }
    Organization:
      type: object
      required: [id, name, slug, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OrgMember:
      type: object
      required: [org_id, user_id, email, name, joined_at]
      properties:
        org_id: { type: string }
        user_id: { type: string }
        email: { type: string }
        name: { type: string }
        joined_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, actor_id, actor_email, action, resource_type, created_at]
      properties:
        id: { type: string }
        actor_id: { type: string }
        actor_email: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        domain: { type: string }
        diff: { type: string }
        ip: { type: string }
        request_id: { type: string }
        created_at: { type: string, format: date-time }
    SettingDefinition:
      type: object
      required: [key, type, default, group, label, public, is_flag]
      properties:
        key: { type: string }
        type: { type: string, enum: [bool, int, string] }
        default: { type: string }
        group: { type: string }
        label: { type: string }
        public: { type: boolean }
        is_flag: { type: boolean }
    Setting:
      allOf:
        - $ref: "#/components/schemas/SettingDefinition"
        - type: object
          required: [value]
          properties:
            value: { type: string }
            updated_by: { type: string }
            updated_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, user_id, type, title, body, link, read_at, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: string }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    APIKey:
      type: object
      required: [id, user_id, name, prefix, scopes, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        last_used_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    EmailMessage:
      type: object
      required: [id, to, subject, kind, status, attempts, created_at]
      properties:
        id: { type: string }
        to: { type: string }
        subject: { type: string }
        kind: { type: string }
        status: { type: string, enum: [queued, sent, failed, dead] }
        attempts: { type: integer }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
    WebhookEndpoint:
      type: object
      required: [id, url, events, active, created_at, updated_at]
      properties:
        id: { type: string }
        url: { type: string }
        events: { type: array, items: { type: string } }
        description: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookDelivery:
      type: object
      required: [id, endpoint_id, event, payload, status, attempts, last_response_status, created_at]
      properties:
        id: { type: string }
        endpoint_id: { type: string }
        event: { type: string }
        payload: { type: string }
        status: { type: string, enum: [pending, success, failed] }
        attempts: { type: integer }
        last_response_status: { type: integer }
        last_error: { type: string }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    NameCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer, format: int64 }
    DayCount:
      type: object
      required: [day, count]
      properties:
        day: { type: string }
        count: { type: integer, format: int64 }
    OutboxEvent:
      type: object
      required: [id, event_type, aggregate_id, payload, created_at, attempts]
      properties:
        id: { type: string }
        event_type: { type: string, description: e.g. user.enriched }
        aggregate_id: { type: string }
        payload: { type: string, description: JSON-encoded event body }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Relay headers propagating trace context across the hop
        created_at: { type: string, format: date-time }
        claimed_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time }
        attempts: { type: integer }
    OutboxList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/OutboxEvent" }
        next_cursor:
          type: string
          description: Empty on the last page.
    DeadLetter:
      type: object
      required: [id, source, topic, payload, reason, attempts, created_at]
      properties:
        id: { type: string }
        source:
          type: string
          description: Stream that parked the message (kafka or nats)
        topic: { type: string }
        payload: { type: string, description: JSON-encoded message body }
        reason:
          type: string
          enum: [malformed, unknown_user, max_attempts]
          description: Why the message was parked
        attempts: { type: integer }
        created_at: { type: string, format: date-time }
        replayed_at: { type: string, format: date-time }
    DeadLetterList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/DeadLetter" }
        next_cursor:
          type: string
          description: Empty on the last page.
    User:
      type: object
      required: [id, email, name, created_at, updated_at]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        external_ref:
          type: string
          description: Correlation id used by the Kafka and NATS enrichment streams.
        enrich_profile:
          type: string
          description: Raw JSON object of Kafka-owned enrichment fields.
        enrich_contact:
          type: string
          description: Raw JSON object of NATS-owned enrichment fields.
        enriched_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Me:
      type: object
      allOf:
        - $ref: "#/components/schemas/User"
      required: [orgs, active_org, roles, permissions, impersonated]
      properties:
        orgs:
          type: array
          description: Organizations the account can enter; [] keeps the SPA's reads safe.
          items: { $ref: "#/components/schemas/Organization" }
        active_org:
          type: string
          description: Casbin domain of the active organization; empty is the platform scope.
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          description: Expanded catalog permissions (object:action) the UI gates on.
          items: { type: string }
        impersonated: { type: boolean }
        impersonator_id: { type: string }
        impersonator_name: { type: string }
    UserWithToken:
      type: object
      required: [user, token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        name: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }
        name: { type: string }
        external_ref: { type: string, description: Correlation id for the enrichment streams. }
    UpdateUserRequest:
      type: object
      required: [email, name]
      properties:
        email: { type: string }
        name: { type: string }
        external_ref: { type: string, description: Correlation id for the enrichment streams. }
    EnrichDemoRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [kafka, nats]
          description: Which stream to publish into.
    EnrichDemoResult:
      type: object
      required: [published, source, event_id, seq]
      properties:
        published: { type: boolean }
        source: { type: string }
        event_id: { type: string }
        seq: { type: integer, format: int64 }
    UserList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor:
          type: string
          description: Empty on the last page.
    Job:
      type: object
      required: [id, type, status, payload, error, created_at, updated_at]
      properties:
        id: { type: string }
        type: { type: string, example: user.enrich_batch }
        status: { type: string, enum: [queued, running, done, failed] }
        payload: { type: string, description: Raw JSON payload }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    JobList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor:
          type: string
          description: Empty on the last page.
    Report:
      type: object
      required: [id, status, result, error, created_at, updated_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [done, failed] }
        result: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReportList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Report" }
        next_cursor:
          type: string
          description: Empty on the last page.
    AnalyticsSummary:
      type: object
      required:
        [total_users, password_identities, google_identities, github_identities,
         facebook_identities, twitter_identities, enrichment_succeeded,
         enrichment_failed, jobs_queued, jobs_done, jobs_failed]
      properties:
        total_users: { type: integer }
        password_identities: { type: integer }
        google_identities: { type: integer }
        github_identities: { type: integer }
        facebook_identities: { type: integer }
        twitter_identities: { type: integer }
        enrichment_succeeded: { type: integer }
        enrichment_failed: { type: integer }
        jobs_queued: { type: integer }
        jobs_done: { type: integer }
        jobs_failed: { type: integer }
        events_registered: { type: integer, description: Present when the event warehouse is configured }
        events_logged_in: { type: integer }
        events_oauth_linked: { type: integer }
        events_jobs_queued: { type: integer }
        events_jobs_done: { type: integer }
        events_jobs_failed: { type: integer }
    EnrichmentProfile:
      type: object
      required: [user_id, source, payload, created_at]
      properties:
        user_id: { type: string }
        source: { type: string, example: randomuser.me }
        payload: { type: string, description: Raw JSON profile from the source }
        created_at: { type: string, format: date-time }
    SessionInfo:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: string, description: Short non-secret prefix of the session token }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }
    AuthIdentity:
      type: object
      required: [user_id, provider, provider_subject, email, name, linked_at, last_login_at]
      properties:
        user_id: { type: string }
        provider: { type: string, enum: [password, google, github, facebook, twitter] }
        provider_subject: { type: string }
        email: { type: string }
        name: { type: string }
        avatar_url: { type: string }
        linked_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    OAuthProviderInfo:
      type: object
      required: [name, configured]
      properties:
        name: { type: string }
        configured: { type: boolean }
    EventRecord:
      type: object
      required: [name, occurred_at]
      properties:
        name: { type: string, example: user_logged_in }
        occurred_at: { type: string, format: date-time }
        user_id: { type: string }
    EventDayPoint:
      type: object
      required: [day, events, total]
      properties:
        day: { type: string, example: "2026-09-26" }
        events:
          type: object
          description: Count per event name
          additionalProperties: { type: integer }
        total: { type: integer }
    Problem:
      type: object
      description: RFC 9457 problem details; internal error details are never leaked.
      required: [title, status]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    TicketStep:
      type: object
      description: One approval step; the named role decides it in order.
      required: [name, approver_role]
      properties:
        name: { type: string }
        approver_role: { type: string, example: approver }
    TicketType:
      type: object
      required: [id, key, name, steps, active, created_at, updated_at]
      properties:
        id: { type: string }
        org_id: { type: string, description: Empty for platform-wide types }
        key: { type: string, example: expense }
        name: { type: string }
        description: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/TicketStep" }
        active: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketTypeList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TicketType" }
    Ticket:
      type: object
      description: |
        A request moved through the approval state machine. rejected was
        refused by an approver; withdrawn was closed by the requester
        themselves — the two terminal outcomes are distinct.
      required: [id, number, type_id, type_key, title, description, priority, status, current_step, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        number:
          type: integer
          description: Per-organization sequence, displayed as TCK-0001
        org_id: { type: string }
        type_id: { type: string }
        type_key: { type: string }
        title: { type: string }
        description: { type: string }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [draft, in_review, approved, completed, rejected, withdrawn] }
        current_step: { type: integer, description: Zero-based index of the step awaiting a decision }
        created_by: { type: string }
        decided_by: { type: string, description: Who produced the terminal outcome }
        decided_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TicketList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Ticket" }
        next_cursor:
          type: string
          description: Empty on the last page.
    TicketApproval:
      type: object
      required: [id, ticket_id, step_index, name, approver_role, status, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        step_index: { type: integer }
        name: { type: string }
        approver_role: { type: string }
        status: { type: string, enum: [pending, approved, rejected, skipped] }
        decided_by: { type: string }
        decided_at: { type: [string, "null"], format: date-time }
        comment: { type: string, description: Mandatory on rejection }
        created_at: { type: string, format: date-time }
    TicketApprovalList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/TicketApproval" }
    TicketDetail:
      type: object
      required: [ticket, approvals]
      properties:
        ticket: { $ref: "#/components/schemas/Ticket" }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/TicketApproval" }
    TicketComment:
      type: object
      required: [id, ticket_id, author_id, body, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        author_id: { type: string }
