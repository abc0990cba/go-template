      operationId: listRecentEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Newest events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventRecord" }
        default: { $ref: "#/components/responses/Problem" }
  /api/events/stream:
    get:
      tags: [analytics]
      summary: Server-Sent Events stream (analytics events, job updates, snapshots)
      description: |
        text/event-stream. Every message is one JSON object on the data line:
        `{"type":"analytics.event|job.updated|snapshot|connected","payload":{...}}`.
        Snapshots arrive every ~5s and carry the summary plus the newest jobs;
        heartbeats are comment lines.
      operationId: streamEvents
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }
  /api/events/ws:
    get:
      tags: [analytics]
      summary: WebSocket stream carrying the same events as /api/events/stream
      description: |
        Upgrades to WebSocket. Every text frame is one JSON object:
        `{"type":"analytics.event|job.updated|snapshot|connected","payload":{...}}`.
        The server pings idle connections every ~15s; client frames are not
        interpreted. Cross-site handshakes (browser Origin other than the API
        host) are refused — cookies ride along on WebSocket upgrades.
      operationId: streamEventsWS
      security: [{ bearerAuth: [] }]
      responses:
        "101": { description: Switched to WebSocket }
        "403": { $ref: "#/components/responses/Problem" }
        default: { $ref: "#/components/responses/Problem" }
