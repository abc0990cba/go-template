openapi: 3.1.0
info:
  title: Go Template Playground API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      responses:
        "200": { description: service is alive }
  /api/auth/register:
    post:
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: registered }
  /api/auth/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: logged in }
  /api/auth/logout:
    post:
      responses:
        "204": { description: logged out }
  /api/me:
    get:
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: current user }
  /api/users:
    get:
      summary: List users with offset, cursor, or keyset pagination
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [offset, cursor, keyset] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: after, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: users }
    post:
      summary: Create user
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201": { description: created }
  /api/analytics/summary:
    get:
      responses:
        "200": { description: analytics summary }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        name: { type: string }
