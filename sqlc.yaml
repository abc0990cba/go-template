version: "2"
sql:
  - engine: postgresql
    schema:
      - migrations/postgres/000001_init.up.sql
      - migrations/postgres/000002_sessions.up.sql
      - migrations/postgres/000003_listing.up.sql
      - migrations/postgres/000004_rbac.up.sql
      - migrations/postgres/000005_audit.up.sql
      - migrations/postgres/000006_settings.up.sql
      - migrations/postgres/000007_notifications.up.sql
      - migrations/postgres/000008_email_tokens.up.sql
      - migrations/postgres/000009_api_keys.up.sql
      - migrations/postgres/000010_impersonation.up.sql
      - migrations/postgres/000011_webhooks.up.sql
      - migrations/postgres/000012_tickets.up.sql
      - migrations/postgres/000013_streams.up.sql
      - migrations/postgres/000014_mfa.up.sql
      - migrations/postgres/000015_refresh_tokens.up.sql
      - migrations/postgres/000016_search.up.sql
    queries: queries
    gen:
      go:
        package: db
        out: internal/platform/postgres/db
        sql_package: pgx/v5
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "string"
