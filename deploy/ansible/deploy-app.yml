---
# Fast-path deploy used by:
#   make vps-app-deploy TAG=v1.2.3   → jobs=app with a new image tag
#   make vps-update JOBS=caddy ...   → re-render + redeploy a job subset
# Uses the same job specs and health gates as the full site.yml converge.
- name: Deploy selected jobs
  hosts: vps
  become: true
  roles:
    - role: nomad_jobs
      vars:
        nomad_jobs_selected: "{{ jobs | default(['app']) }}"

- name: Smoke check
  hosts: vps
  become: true
  tasks:
    - name: Wait for https://{{ app_domain }}/health/ready through caddy
      ansible.builtin.uri:
        url: "https://{{ app_domain }}/health/ready"
        validate_certs: "{{ not (acme_staging | bool) }}"
        status_code: 200
      register: smoke
      retries: 30
      delay: 10
      until: smoke.status == 200
      when: "'app' in (jobs | default(['app']))"

    - name: Result
      ansible.builtin.debug:
        msg:
          - "Deployed: {{ jobs | default(['app']) | join(', ') }}"
          - "Image:    {{ app_image }}:{{ app_image_tag }}"
          - "App:      https://{{ app_domain }}"
