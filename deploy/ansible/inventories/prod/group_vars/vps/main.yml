# =============================================================================
# Production VPS deployment — tunable knobs (non-secret).
# Secrets live in secrets.yml (ansible-vault encrypted, generated by
# `make vps-setup`). Everything here is safe to commit.
# =============================================================================

# --- Identity -----------------------------------------------------------------
# The automation/operator account the playbook creates and (after bootstrap)
# connects as. Root login is disabled by the hardening step.
vps_deploy_user: deploy
# TLS: 'acme' = Let's Encrypt via Caddy (production). 'internal' = Caddy's
# built-in CA for local rehearsal (docs/vps/LOCAL-REHEARSAL.md).
tls_mode: acme
# 'full' = complete production hardening; 'light' skips apt-upgrade/fail2ban/
# unattended-upgrades/UFW (used by the local OrbStack rehearsal).
hardening_level: full
# Subdomains pointed at the VPS IP (A records). Caddy obtains Let's Encrypt
# certificates for all of them automatically.
app_domain: app.example.com
ci_domain: ci.example.com
grafana_domain: grafana.example.com
acme_email: admin@example.com
# Start against the Let's Encrypt STAGING CA (no rate limits while testing).
# Flip to false with `make vps-acme-production` once DNS + firewall are proven.
acme_staging: true

# --- CI (Woodpecker) ----------------------------------------------------------
# Set false on a small VPS (see docs/vps/deployment.md#sizing). The OAuth
# client id/secret for the GitHub forge live in secrets.yml; the server starts
# without them and the docs explain the one-time GitHub OAuth app setup.
ci_enabled: true
# GitHub login granted admin in Woodpecker (empty = the first authenticated
# user becomes admin). Optional; set after you know your GitHub login.
woodpecker_admin_user: ""
# Repository the bootstrap build clones for the first image build (before CI
# exists). Public URL; for a private repo see docs/vps/deployment.md#private-repos.
bootstrap_repo_url: https://github.com/your-org/go-template.git

# --- Observability ------------------------------------------------------------
monitoring_enabled: true
# Alert delivery beyond the Alertmanager UI. One of: none | telegram | slack | email.
# Credentials for the chosen receiver go into secrets.yml (see its .example).
alert_receiver: none
# Prometheus TSDB retention on the VPS disk.
prometheus_retention: 15d

# --- App ----------------------------------------------------------------------
# Registry/image for deploys. The local registry is the primary source
# (built by Woodpecker on the VPS); change to ghcr.io/<org>/go-template to
# consume release-pipeline images instead (see docs for the fallback path).
app_image: 127.0.0.1:5000/go-template
app_image_tag: v0.1.0        # bootstrap tag; CI advances it on every v* release
api_replicas: 1              # >1 needs the Phase-2 multi-node layout (docs)
app_report_cron: "0 3 * * *"

# --- Optional app integrations (all empty = feature off, app tolerates it) ----
app_smtp_host: ""
app_smtp_port: "587"
app_smtp_username: ""
app_smtp_from: "no-reply@{{ app_domain }}"
# OAuth providers: put client id/secret in secrets.yml (app_oauth_google: {...} etc.)

# --- Versions (pinned; bump deliberately) --------------------------------------
nomad_version: "2.0.7"        # exact release; installed from GitHub releases
docker_apt_version: "5:28"   # apt wildcard pin: 5:28.x
caddy_image: "caddy:2.10.2"
postgres_image: "postgres:16.9"
redis_image: "redis:7.4.5-alpine"
registry_image: "registry:2.8.3"
woodpecker_image: "woodpeckerci/woodpecker-server:v3"
woodpecker_agent_image: "woodpeckerci/woodpecker-agent:v3"
prometheus_image: "prom/prometheus:v3.4.1"
alertmanager_image: "prom/alertmanager:v0.28.1"
grafana_image: "grafana/grafana:11.6.0"
# Log aggregation (Loki + promtail ship container logs to Grafana Explore)
# and external-ish uptime probing (Uptime Kuma behind its own subdomain).
# Both off in the 2 GB lean profile.
monitoring_logs_enabled: true
monitoring_uptime_enabled: true
loki_image: "grafana/loki:3.4.2"
promtail_image: "grafana/promtail:3.4.2"
uptime_kuma_image: "louislam/uptime-kuma:1.23.16"
monitoring_asynqmon_enabled: true
asynqmon_image: "hibiken/asynqmon:0.8.1"
uptime_domain: uptime.example.com
node_exporter_image: "prom/node-exporter:v1.9.1"
blackbox_exporter_image: "prom/blackbox-exporter:v0.26.0"
trivy_image: "aquasec/trivy:0.63.0"
pipeline_nomad_version: "2.0.7"  # nomad binary used inside the CI deploy step

# --- Backup --------------------------------------------------------------------
# Local nightly pg_dump is always on. Fill backup_remote_* in secrets.yml to
# also push archives off-site via rclone (S3/B2/any rclone target).
backup_local_retention_days: 7
backup_at: "03:15"

# --- Paths (host filesystem) ----------------------------------------------------
vps_base_dir: /opt/go-template
