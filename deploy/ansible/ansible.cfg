# Ansible configuration for the VPS deployment.
# All runs go through deploy/ansible/scripts/run-playbook.sh (or `make vps-deploy`),
# which sets the inventory site and the vault password file.
[defaults]
inventory = inventories/prod
roles_path = roles
# Fail fast on unreachable hosts instead of hanging the whole converge.
forks = 5
retry_files_enabled = False
interpreter_python = auto_silent
# Auto-generated by `make vps-setup`; gitignored. Remove this line and use
# --ask-vault-pass if you prefer typing the vault password every run.
vault_password_file = .vault-pass
deprecation_warnings = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new
