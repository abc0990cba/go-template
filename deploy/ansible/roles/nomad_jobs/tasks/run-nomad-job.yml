---
# Include with vars: job_name, job_file (optional), job_vars (optional argv
# list), job_timeout (optional seconds). Blocking `nomad job run` waits for
# the deployment to finish: service jobs gate on their health checks, so a
# zero exit means healthy; a failure leaves auto_revert's rollback in place.
- name: "Validate {{ job_name }} job spec"
  ansible.builtin.command:
    argv: "{{ (['nomad', 'job', 'validate'] + (job_vars | default([])) + [job_file | default(vps_base_dir ~ '/jobs/' ~ job_name ~ '.nomad.hcl')]) }}"
    environment: "{{ nomad_cli_env }}"
  changed_when: false
  no_log: true

- name: "Run {{ job_name }} (waits for a healthy deployment)"
  ansible.builtin.command:
    argv: "{{ (['nomad', 'job', 'run'] + (job_vars | default([])) + [job_file | default(vps_base_dir ~ '/jobs/' ~ job_name ~ '.nomad.hcl')]) }}"
    environment: "{{ nomad_cli_env }}"
  timeout: "{{ job_timeout | default(600) }}"
  no_log: true
