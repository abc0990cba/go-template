{{- if and (not .Values.secrets.existingSecret) .Values.secrets.data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "go-template.fullname" . }}
  labels:
    {{- include "go-template.labels" . | nindent 4 }}
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
