{{- if .Values.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "go-template.fullname" . }}-api
  labels:
    {{- include "go-template.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    # Rollouts implements the scale subresource, so the HPA tracks whichever
    # workload kind is active.
    apiVersion: {{ if .Values.rollout.enabled }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
    kind: {{ include "go-template.apiWorkloadKind" . }}
    name: {{ include "go-template.fullname" . }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}
{{- end }}
