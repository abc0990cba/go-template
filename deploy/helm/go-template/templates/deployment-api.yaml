{{- if not .Values.rollout.enabled }}
{{/* Classic Deployment with a maxUnavailable:0 rolling update. Set
     rollout.enabled=true to replace this with an Argo Rollouts canary
     (templates/rollout.yaml) instead. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-template.fullname" . }}-api
  labels:
    {{- include "go-template.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "go-template.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    {{- include "go-template.api.podSpec" . | nindent 4 }}
{{- end }}
