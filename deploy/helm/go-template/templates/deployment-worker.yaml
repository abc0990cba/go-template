{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-template.fullname" . }}-worker
  labels:
    {{- include "go-template.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "go-template.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "go-template.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- if .Values.worker.metricsAddr }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsAddr | trimPrefix ":" | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "go-template.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            capabilities:
              drop:
                {{- toYaml .Values.securityContext.capabilities.drop | nindent 16 }}
          args: ["/app/worker"]
          env:
            {{- include "go-template.env" . | nindent 12 }}
            {{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.worker.metricsAddr }}
            - name: APP_METRICS_ADDR
              value: {{ .Values.worker.metricsAddr | quote }}
            {{- end }}
          ports:
            {{- if .Values.worker.metricsAddr }}
            - name: metrics
              containerPort: {{ .Values.worker.metricsAddr | trimPrefix ":" | int }}
            {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.secrets.data }}
          volumeMounts:
            - name: secrets
              mountPath: /etc/go-template-secrets
              readOnly: true
          {{- end }}
      {{- if .Values.secrets.data }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ .Values.secrets.existingSecret | default (include "go-template.fullname" .) }}
      {{- end }}
{{- end }}
