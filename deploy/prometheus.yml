# Prometheus configuration. Scrapes the app's whitebox metrics (api + worker),
# the blackbox synthetic probe, and evaluates the rule files in
# deploy/prometheus/rules/ (alerts + SLO burn rates). Firing alerts are sent
# to Alertmanager (deploy/alertmanager/alertmanager.yml).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: go-template
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]

  # Stream consumers, the outbox relay, and dead-letter depth live in the
  # worker process; it serves its own /metrics when APP_METRICS_ADDR is set.
  - job_name: go-template-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9090"]

  # Synthetic outside-in check: Prometheus asks the blackbox exporter to GET
  # /health/live like a real client would. probe_success == 0 means the front
  # door is shut regardless of what in-process metrics claim.
  - job_name: blackbox-api-live
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8080/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
