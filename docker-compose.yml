services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    environment:
      APP_HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - clickhouse

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    depends_on:
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
