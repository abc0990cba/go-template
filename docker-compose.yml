services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/api"]
    environment:
      APP_HTTP_ADDR: ":8080"
      APP_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      clickhouse:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    environment:
      APP_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickdata:/var/lib/clickhouse

volumes:
  pgdata:
  clickdata:
