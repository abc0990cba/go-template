services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 1.0.0
    command: ["/app/api"]
    environment:
      APP_HTTP_ADDR: ":8080"
      APP_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      APP_REDIS_ADDR: redis:6379
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-1025}
      APP_LOG_FORMAT: json
      APP_OTLP_ENDPOINT: jaeger:4318
      APP_COOKIE_SECURE: "0" # plain http behind a local port; enable in production
      APP_CLICKHOUSE_ADDR: clickhouse:9000
      APP_CLICKHOUSE_USER: app
      APP_CLICKHOUSE_PASSWORD: app
      APP_DEMO_EMAIL: demo@go-template.local
      APP_DEMO_PASSWORD: demo-password-123
      APP_DEMO_SEED: "1" # idempotent demo dataset: users, jobs, reports, events
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/worker"]
    # The shared image healthcheck probes the api binary; the worker has no
    # HTTP listener, so the check is disabled rather than lying unhealthy.
    healthcheck:
      disable: true
    environment:
      APP_DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      APP_REDIS_ADDR: redis:6379
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-1025}
      APP_REPORT_CRON: "0 3 * * *"
      APP_CLICKHOUSE_ADDR: clickhouse:9000
      APP_CLICKHOUSE_USER: app
      APP_CLICKHOUSE_PASSWORD: app
      APP_LOG_FORMAT: json
      APP_OTLP_ENDPOINT: jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "55432:5432" # host port differs from 5432 to dodge local port-forwarder quirks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: app
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickdata:/var/lib/clickhouse

  mailpit:
    image: axllent/mailpit:v1.24
    profiles: ["mail"] # start with: docker compose --profile mail up
    ports:
      - "8025:8025" # Web UI to read dev email
      - "1025:1025" # SMTP

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    profiles: ["files"] # start with: docker compose --profile files up
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: filesapp
      MINIO_ROOT_PASSWORD: files-secret
    ports:
      - "19000:9000" # S3 API (host; 9000 collides with ClickHouse)
      - "19001:9001" # Web console
    volumes:
      - filedata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    profiles: ["observability"]
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
  clickdata:
