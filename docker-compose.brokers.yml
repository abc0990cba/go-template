# Brokers for the enrichment streams: append to the core stack with
#
#   docker compose -f docker-compose.yml -f docker-compose.brokers.yml up -d
#
# or use `make demo-up`. Redpanda speaks the Kafka protocol (single binary,
# no ZooKeeper/KRaft gymnastics); NATS runs with JetStream enabled.
services:
  api:
    environment:
      APP_KAFKA_BROKERS: redpanda:9092
      APP_NATS_URL: nats://nats:4222
    depends_on:
      redpanda:
        condition: service_healthy
      nats:
        condition: service_healthy

  worker:
    environment:
      APP_KAFKA_BROKERS: redpanda:9092
      APP_NATS_URL: nats://nats:4222
      APP_METRICS_ADDR: ":9090"
    ports:
      - "19090:9090"
    depends_on:
      redpanda:
        condition: service_healthy
      nats:
        condition: service_healthy

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    # Two listeners: INTERNAL for the containers (redpanda:9092), EXTERNAL
    # advertised as localhost:19092 so host-side tools (cmd/devtools, kcat)
    # can reach the cluster without DNS gymnastics.
    command:
      - redpanda
      - start
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
